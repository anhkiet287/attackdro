# Default training config. Override on the CLI, e.g.:
#   python src/train.py --config configs/default.yaml --epochs 20
seed: 42
device: cuda          # falls back to cpu automatically if unavailable

# Toy problem so the loop runs end-to-end out of the box.
input_dim: 64
hidden_dim: 256
output_dim: 10
num_samples: 50000

# Optimization
epochs: 5
batch_size: 512
lr: 0.001
