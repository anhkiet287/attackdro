# =============================================================================
# gate_alpha_bindaware_probe.yaml — GATE-α DECISION-GRADE fixed-probe run.
# Inherits bindaware_sample (per-sample soft) at T=0.25 — the recipe that
# BALANCES the norms (~.73/.27/.00 binding), so the chance baseline is low
# enough for per-sample persistence to carry real signal. Contrast: avg_frozen
# is linf-locked (.98), chance ~92%, persistence base-rate-driven (+2pp) —
# uninformative. THIS run is the critical-path Gate-α experiment.
#
# ONLY change vs bindaware_sample T=0.25: turn the fixed indexed probe ON
# (512 samples, dump [G,B] loss matrix every 5 epochs over the full 50-epoch
# run) to capture the post-lr-drop (ep 25, 40) migration window (F6).
# Dumps -> dumps/probe_binding/gate_alpha_bindaware_T025_s0/.
# =============================================================================
_base_: configs/legacy/bindaware_sample.yaml

run_name: gate_alpha_bindaware_T025_s0

train:
  groupdro:
    temperature: 0.25
    probe_binding: true
    probe_binding_size: 512
    probe_binding_every: 5
