# B2 static allocation baseline under the locked RAMP80/APGD 10/10/10 protocol.
# Inherits the B1 train49k/val1k control recipe and changes only allocation.

_base_: configs/paper/reactive_softT_full10_ramp80_apgd_8255_t49k_v1k.yaml

# run_paths() strips the trailing _s0 for local layout, yielding:
# results/b2_static_cycle_ramp80_apgd_8255_t49k_v1k/s0/
run_name: b2_static_cycle_ramp80_apgd_8255_t49k_v1k_s0

wandb:
  tags:
    - cifar10
    - prn18
    - ramp80
    - eps8255
    - apgd-train-10-10-10
    - eval-20-20-100
    - t49k-v1k
    - seed0
    - screen
    - family-static-allocation
    - variant-static-cycle
  tier: in-house

train:
  allocation_mode: static_cycle
  static_cycle_order: [linf, l2, l1]
