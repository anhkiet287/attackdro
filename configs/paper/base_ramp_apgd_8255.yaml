# Canonical paper protocol: RAMP recipe + APGD training at eps=(8/255,0.5,12).
# Raw paper configs inherit this file so they are safe to run without hidden CLI
# overrides.

seed: 0
device: cuda

dataset:
  name: cifar10
  root: data/
  num_classes: 10
  num_workers: 4
  val_holdout: 1000

model:
  arch: preact_resnet18
  normalize: false

threat_model:
  linf:
    eps: 0.03137254901960784
  l2:
    eps: 0.5
  l1:
    eps: 12.0

eval_attack:
  linf: {steps: 20, restarts: 1}
  l2: {steps: 20, restarts: 1}
  l1: {steps: 100, restarts: 1}

method: attackdro
run_name: paper_base_ramp_apgd_8255

train:
  epochs: 80
  batch_size: 128
  lr: 0.05
  momentum: 0.9
  weight_decay: 0.0005
  lr_schedule: multistep
  milestones: [70]
  save_freq: 10
  attack: apgd
  attacks:
    - {norm: linf, steps: 10, step_size: 0.00784313725, random_start: true}
    - {norm: l2, steps: 10, step_size: 0.125, random_start: true}
    - {norm: l1, steps: 10, step_size: 0.10, k: 20, gap: 0.05, random_k: true, random_start: false}
  eval_pgd_steps: 20
  eval_probe_batches: 8
  val_select_n_examples: 1000
  val_select_frequency: 1
  test_monitor_n_examples: 1000
  test_monitor_frequency: 10
  groupdro:
    eta_q: 0.02
    warmup_epochs: 0
    objective: group_dro
    temperature: 0.25
    normalize_losses: none
    probe_binding: false
    probe_binding_size: 512
    probe_binding_every: 1

wandb:
  mode: online
  project: attackdro-union
  entity: null
  group: null
  tags: ["lane:paper"]
  tier: in-house

results_dir: results/
checkpoints_dir: checkpoints/
