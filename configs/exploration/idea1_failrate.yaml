# EXPLORATION Idea 1 — batch fail-rate threshold allocation (Colab, NOT paper-grade).
# Reactive base (per-sample-soft T=0.25, NO predictor); each norm's APGD attack halts once
# >= threshold of the batch has failed (batch-level stop, no per-sample repack — noted as
# future work). Reads: exp/steps_{norm} (self-selected steps), exp/attack_flops_ratio (vs
# 0.665 CARD-PB), l1 train-vs-eval gap. Short run (ep20). exploration:true device:colab.
_base_: configs/paper/reactive_ramprecipe.yaml
run_name: idea1_failrate
results_dir: results/exploration/
wandb:
  tags: ["exploration:true", "device:colab", "idea:1_failrate"]
train:
  epochs: 20
  groupdro:
    failrate_threshold: 0.5     # Idea 1 knob (Kiet's example); stop norm at 50% batch fail
    failrate_max_steps: 10      # hard cap = full 10/10/10 (FLOPs denom = 30)
